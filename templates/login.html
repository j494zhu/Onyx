<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        {% include '_icons.html' %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/shake.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/login_body.css')}}">
        <!-- Same timezone handshake as index.html, so a guest account's sample
             sessions are generated in the visitor's local time, not the server's. -->
        <script>
            (function () {
                try {
                    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    if (tz) document.cookie = 'onyx_tz=' + encodeURIComponent(tz) + '; path=/; max-age=31536000; samesite=lax';
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        
        <div class="container glass-container" style="max-width: 400px; margin-top: 100px;">
            
            <h1 style="text-align: center; color: white">Welcome Back</h1>

            <form action="/login" method="POST">
                <label>Username:</label>
                <input type="text" name="username" required>

                <label>Password:</label>
                <input type="password" name="password" required>

                <button type="submit">Login</button>

                {% if wrong_password %}
                    <p style="text-align: center; font-size: 15px" class="shake-error"> Incorrect password, please try again.</p>
                {% elif user_dne%}
                    <p style="text-align: center; font-size: 15px" class="shake-error"> Username does not exist, please register first.</p>
                {% endif %}
            </form>
            <hr>
            <p style="text-align: center; margin-top: 20px;">
                New here? <a href="/register">Register an account!</a>
            </p>

            <form action="/guest" method="POST">
                <button type="submit" class="btn-guest">Continue without account</button>
            </form>
            <p class="guest-hint">A demo account with sample data, deleted when you log out.</p>

        </div>
        </body>
</html>
